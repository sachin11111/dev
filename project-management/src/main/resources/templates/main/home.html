<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

	<head th:replace="layouts :: header"></head>

	<body>
		<nav th:replace="layouts :: navbar"></nav>

		<div class="container">
			<br>
			<h3>Main Dashboard <a th:text="${versionNumber}" style="font-size:15px"></a></h3>
			<hr>
			<h4>Current Projects</h4>
			<div class="row"> 
				<div class="col-md-6">
					<table class="table table-bordered table-striped">
						<thead class="thead-dark">
							<tr>
								<th>Project Name</th>
								<th>Project Stage</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="aProject : ${projects}">
								<td th:text="${aProject.name}" />
								<td th:text="${aProject.stage}"/>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="col-md-4">
					<canvas id="myPieChart" height="50" width="50"></canvas>
					<script>
						var chartData = "[[${projectStatusCnt}]]"
					</script>
				</div>
			</div>
		</div>		
		<div class="container">	
			<h4>Employees</h4>
			<div class="row">
				<div class="col-md-6">
					<table class="table table-bordered table-striped">
						<thead class="thead-dark">
							<tr>
								<th>First Name</th>
								<th>Last Name</th>
								<th>Project Count</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="aEmpProjCount : ${employees}">
								<td th:text="${aEmpProjCount.firstName}"/>
								<td th:text="${aEmpProjCount.lastName}"/>
								<td th:text="${aEmpProjCount.projectCount}"/>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<script type="text/javascript" th:src="@{js/myChart.js}"></script>
	</body>
</html>
