spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb

spring.sql.init.mode=never
#if set to never it will not execute data.sql and schema.sql on startup

spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.thymeleaf.cache=false
jdbc.url=jdbc:h2:mem;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

#version=${envVersionNum} // this is reading from environment variable - eclipse, linux, windows, prod profile, uat
version=3.3.3